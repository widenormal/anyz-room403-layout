<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-waterfall-bridge-chart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #E8E8E8;
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .slide-label {
      font-size: 12px;
      color: #999999;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid #CCCCCC;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* タイトルエリア */
    .title-area {
      padding: 14px 40px 12px;
      border-bottom: 1px dashed #CCCCCC;
      flex-shrink: 0;
      background: #FAFAFA;
    }
    .area-label {
      font-size: 11px;
      color: #999999;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .title-placeholder {
      font-size: 16px;
      color: #CCCCCC;
      margin-top: 4px;
    }
    /* コンテンツエリア */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 48px 10px;
      gap: 6px;
      overflow: hidden;
    }
    /* ヘッダ行: 単位表記＋凡例 */
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .unit-label {
      font-size: 11px;
      color: #999999;
    }
    .legend {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #555555;
    }
    .legend-swatch {
      width: 14px;
      height: 10px;
      border: 1px solid #CCCCCC;
    }
    /* チャート本体: Y軸＋プロット */
    .chart-body {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .y-axis {
      width: 32px;
      height: 300px;
      position: relative;
      flex-shrink: 0;
    }
    .y-tick {
      position: absolute;
      right: 4px;
      font-size: 10px;
      color: #AAAAAA;
      transform: translateY(50%);
    }
    .plot {
      flex: 1;
      height: 300px;
      position: relative;
      border-left: 1px solid #CCCCCC;
      border-bottom: 1px solid #999999;
    }
    .gridline {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: #EEEEEE;
    }
    /* 棒（柱・浮き棒共通） */
    .bar {
      position: absolute;
      width: 12%;
    }
    .bar-anchor   { background: #333333; }  /* 期首・期末の柱 */
    .bar-increase { background: #D8D8D8; border: 1px solid #AAAAAA; }  /* 増加要因 */
    .bar-decrease { background: #666666; }  /* 減少要因 */
    .bar-value {
      position: absolute;
      width: 12%;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #333333;
    }
    /* 棒間の点線コネクタ */
    .connector {
      position: absolute;
      width: 4%;
      border-top: 1px dashed #999999;
    }
    /* X軸カテゴリラベル */
    .x-labels {
      position: relative;
      height: 30px;
      margin-left: 38px;
      flex-shrink: 0;
    }
    .x-label {
      position: absolute;
      width: 12%;
      text-align: center;
      font-size: 11px;
      color: #555555;
      line-height: 1.3;
    }
    /* 図の読み方 */
    .reading-note {
      font-size: 11px;
      color: #999999;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <p class="slide-label">[waterfall-bridge-chart]</p>
  <div class="slide">

    <!-- タイトルエリア -->
    <div class="title-area">
      <div class="area-label">Title Area — SLIDE.md 参照</div>
      <div class="title-placeholder">スライドタイトルが入ります</div>
    </div>

    <!-- コンテンツエリア -->
    <div class="content-area">

      <!-- ヘッダ行 -->
      <div class="chart-header">
        <span class="unit-label">単位: 百万円</span>
        <div class="legend">
          <div class="legend-item"><span class="legend-swatch" style="background: #333333;"></span>期首・期末実績</div>
          <div class="legend-item"><span class="legend-swatch" style="background: #D8D8D8;"></span>増加要因</div>
          <div class="legend-item"><span class="legend-swatch" style="background: #666666;"></span>減少要因</div>
        </div>
      </div>

      <!-- チャート本体 -->
      <div class="chart-body">
        <!-- Y軸目盛 -->
        <div class="y-axis">
          <span class="y-tick" style="bottom: 290px;">500</span>
          <span class="y-tick" style="bottom: 232px;">400</span>
          <span class="y-tick" style="bottom: 174px;">300</span>
          <span class="y-tick" style="bottom: 116px;">200</span>
          <span class="y-tick" style="bottom: 58px;">100</span>
          <span class="y-tick" style="bottom: 0;">0</span>
        </div>

        <!-- プロット領域（scale: 0.58px / 百万円） -->
        <div class="plot">
          <div class="gridline" style="bottom: 58px;"></div>
          <div class="gridline" style="bottom: 116px;"></div>
          <div class="gridline" style="bottom: 174px;"></div>
          <div class="gridline" style="bottom: 232px;"></div>
          <div class="gridline" style="bottom: 290px;"></div>

          <!-- 1. 前期営業利益 320（柱） -->
          <div class="bar bar-anchor" style="left: 4%; bottom: 0; height: 186px;"></div>
          <div class="bar-value" style="left: 4%; bottom: 190px;">320</div>

          <!-- コネクタ: 320 の水準 -->
          <div class="connector" style="left: 16%; bottom: 186px;"></div>

          <!-- 2. 売上増加 +120（浮き棒・薄グレー） -->
          <div class="bar bar-increase" style="left: 20%; bottom: 186px; height: 70px;"></div>
          <div class="bar-value" style="left: 20%; bottom: 260px;">+120</div>

          <!-- コネクタ: 440 の水準 -->
          <div class="connector" style="left: 32%; bottom: 256px;"></div>

          <!-- 3. 原価率改善 +45（浮き棒・薄グレー） -->
          <div class="bar bar-increase" style="left: 36%; bottom: 256px; height: 26px;"></div>
          <div class="bar-value" style="left: 36%; bottom: 286px;">+45</div>

          <!-- コネクタ: 485 の水準 -->
          <div class="connector" style="left: 48%; bottom: 282px;"></div>

          <!-- 4. 人件費増加 -80（浮き棒・濃グレー） -->
          <div class="bar bar-decrease" style="left: 52%; bottom: 235px; height: 47px;"></div>
          <div class="bar-value" style="left: 52%; bottom: 286px;">−80</div>

          <!-- コネクタ: 405 の水準 -->
          <div class="connector" style="left: 64%; bottom: 235px;"></div>

          <!-- 5. 販促費増加 -55（浮き棒・濃グレー） -->
          <div class="bar bar-decrease" style="left: 68%; bottom: 203px; height: 32px;"></div>
          <div class="bar-value" style="left: 68%; bottom: 286px;">−55</div>

          <!-- コネクタ: 350 の水準 -->
          <div class="connector" style="left: 80%; bottom: 203px;"></div>

          <!-- 6. 当期営業利益 350（柱） -->
          <div class="bar bar-anchor" style="left: 84%; bottom: 0; height: 203px;"></div>
          <div class="bar-value" style="left: 84%; bottom: 207px;">350</div>
        </div>
      </div>

      <!-- X軸カテゴリラベル -->
      <div class="x-labels">
        <span class="x-label" style="left: 4%;">前期<br>営業利益</span>
        <span class="x-label" style="left: 20%;">売上増加</span>
        <span class="x-label" style="left: 36%;">原価率改善</span>
        <span class="x-label" style="left: 52%;">人件費増加</span>
        <span class="x-label" style="left: 68%;">販促費増加</span>
        <span class="x-label" style="left: 84%;">当期<br>営業利益</span>
      </div>

      <!-- 図の読み方 -->
      <div class="reading-note">図の読み方: 左端の前期実績から、増加要因（薄グレー）・減少要因（濃グレー）を階段状に積み上げ、右端の当期実績に至る増減の内訳を示す。</div>

    </div>
  </div>
</body>
</html>
