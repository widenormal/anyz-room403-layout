<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-butterfly-comparison-chart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #E8E8E8;
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .slide-label {
      font-size: 12px;
      color: #999999;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid #CCCCCC;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* タイトルエリア */
    .title-area {
      padding: 14px 40px 12px;
      border-bottom: 1px dashed #CCCCCC;
      flex-shrink: 0;
      background: #FAFAFA;
    }
    .area-label {
      font-size: 11px;
      color: #999999;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .title-placeholder {
      font-size: 16px;
      color: #CCCCCC;
      margin-top: 4px;
    }
    /* コンテンツエリア */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 48px 12px;
      gap: 8px;
      overflow: hidden;
    }
    /* グループ名ヘッダ */
    .group-header {
      display: grid;
      grid-template-columns: 1fr 150px 1fr;
      align-items: center;
      flex-shrink: 0;
    }
    .group-name {
      font-size: 13px;
      font-weight: bold;
      color: #333333;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .group-name.left  { justify-content: flex-end; }
    .group-name.right { justify-content: flex-start; }
    .group-swatch {
      width: 14px;
      height: 10px;
      border: 1px solid #CCCCCC;
    }
    .center-header {
      text-align: center;
      font-size: 11px;
      color: #999999;
    }
    /* 行グリッド */
    .butterfly-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    .b-row {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 150px 1fr;
      align-items: center;
      min-height: 0;
    }
    .category-label {
      text-align: center;
      font-size: 12px;
      color: #333333;
      padding: 0 8px;
      line-height: 1.3;
    }
    /* 左右ゾーン（棒は中央から外へ鏡映しに伸びる） */
    .zone-left {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      border-right: 1px solid #CCCCCC;
      min-width: 0;
    }
    .zone-right {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      border-left: 1px solid #CCCCCC;
      min-width: 0;
    }
    .bar {
      height: 20px;
    }
    .bar-own  { background: #333333; }                          /* 自社 */
    .bar-comp { background: #AAAAAA; border: 1px solid #999999; } /* 競合A社 */
    .bar-value {
      font-size: 11px;
      font-weight: bold;
      color: #555555;
      white-space: nowrap;
      flex-shrink: 0;
    }
    /* X軸スケール */
    .x-axis {
      display: grid;
      grid-template-columns: 1fr 150px 1fr;
      flex-shrink: 0;
    }
    .x-scale {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #AAAAAA;
    }
    .x-scale.left  { flex-direction: row-reverse; }
    .reading-note {
      font-size: 11px;
      color: #999999;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <p class="slide-label">[butterfly-comparison-chart]</p>
  <div class="slide">

    <!-- タイトルエリア -->
    <div class="title-area">
      <div class="area-label">Title Area — SLIDE.md 参照</div>
      <div class="title-placeholder">スライドタイトルが入ります</div>
    </div>

    <!-- コンテンツエリア -->
    <div class="content-area">

      <!-- グループ名ヘッダ -->
      <div class="group-header">
        <div class="group-name left"><span class="group-swatch" style="background: #333333;"></span>自社</div>
        <div class="center-header">評価項目</div>
        <div class="group-name right"><span class="group-swatch" style="background: #AAAAAA;"></span>競合A社</div>
      </div>

      <!-- 行: 中央カテゴリ列＋左右の対向棒（棒幅% = スコア/100点） -->
      <div class="butterfly-rows">
        <div class="b-row">
          <div class="zone-left"><span class="bar-value">72</span><div class="bar bar-own" style="width: 72%;"></div></div>
          <div class="category-label">価格競争力</div>
          <div class="zone-right"><div class="bar bar-comp" style="width: 80%;"></div><span class="bar-value">80</span></div>
        </div>
        <div class="b-row">
          <div class="zone-left"><span class="bar-value">85</span><div class="bar bar-own" style="width: 85%;"></div></div>
          <div class="category-label">製品品質</div>
          <div class="zone-right"><div class="bar bar-comp" style="width: 78%;"></div><span class="bar-value">78</span></div>
        </div>
        <div class="b-row">
          <div class="zone-left"><span class="bar-value">58</span><div class="bar bar-own" style="width: 58%;"></div></div>
          <div class="category-label">ブランド認知</div>
          <div class="zone-right"><div class="bar bar-comp" style="width: 88%;"></div><span class="bar-value">88</span></div>
        </div>
        <div class="b-row">
          <div class="zone-left"><span class="bar-value">64</span><div class="bar bar-own" style="width: 64%;"></div></div>
          <div class="category-label">販売網</div>
          <div class="zone-right"><div class="bar bar-comp" style="width: 75%;"></div><span class="bar-value">75</span></div>
        </div>
        <div class="b-row">
          <div class="zone-left"><span class="bar-value">80</span><div class="bar bar-own" style="width: 80%;"></div></div>
          <div class="category-label">アフターサポート</div>
          <div class="zone-right"><div class="bar bar-comp" style="width: 62%;"></div><span class="bar-value">62</span></div>
        </div>
        <div class="b-row">
          <div class="zone-left"><span class="bar-value">76</span><div class="bar bar-own" style="width: 76%;"></div></div>
          <div class="category-label">開発スピード</div>
          <div class="zone-right"><div class="bar bar-comp" style="width: 55%;"></div><span class="bar-value">55</span></div>
        </div>
      </div>

      <!-- X軸スケール -->
      <div class="x-axis">
        <div class="x-scale left"><span>0</span><span>50</span><span>100</span></div>
        <div></div>
        <div class="x-scale"><span>0</span><span>50</span><span>100</span></div>
      </div>

      <!-- 図の読み方 -->
      <div class="reading-note">図の読み方: 中央の評価項目を挟み、左＝自社・右＝競合A社のスコア（顧客評価調査・100点満点）が鏡映しに伸びる。左右の棒の長さの差が項目別の優劣を示す。</div>

    </div>
  </div>
</body>
</html>
