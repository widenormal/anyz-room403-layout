<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-venn-three-circle-overlap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #E8E8E8;
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .slide-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid #CCCCCC;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* タイトルエリア */
    .title-area {
      padding: 14px 40px 12px;
      border-bottom: 1px dashed #CCCCCC;
      flex-shrink: 0;
      background: #FAFAFA;
    }
    .area-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .title-placeholder {
      font-size: 16px;
      color: #CCCCCC;
      margin-top: 4px;
    }
    /* コンテンツエリア */
    .content-area {
      flex: 1;
      display: flex;
      padding: 16px 48px;
      gap: 24px;
      overflow: hidden;
    }
    /* 左側: ベン図本体 */
    .venn-body {
      flex: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .venn-body svg {
      width: 100%;
      height: 100%;
      max-height: 430px;
    }
    /* 右側: 凡例エリア */
    .legend-area {
      flex: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }
    .legend-title {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }
    .legend-card {
      border: 1px solid #D8D8D8;
      background: #FAFAFA;
      padding: 8px 12px;
      border-radius: 2px;
    }
    .legend-card-label {
      font-size: 12px;
      font-weight: bold;
      color: #333333;
    }
    .legend-card-desc {
      font-size: 11px;
      color: #666666;
      margin-top: 2px;
    }
    .key-message-card {
      border: 1px solid #999999;
      background: #EEEEEE;
      padding: 10px 12px;
      border-radius: 2px;
    }
    .key-message-label {
      font-size: 12px;
      font-weight: bold;
      color: #333333;
    }
    .key-message-desc {
      font-size: 11px;
      color: #555555;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <p class="slide-label">[venn-three-circle-overlap]</p>
  <div class="slide">

    <!-- タイトルエリア -->
    <div class="title-area">
      <div class="area-label">Title Area — SLIDE.md 参照</div>
      <div class="title-placeholder">スライドタイトルが入ります</div>
    </div>

    <!-- コンテンツエリア -->
    <div class="content-area">

      <!-- 左側: ベン図本体（3C配置） -->
      <div class="venn-body">
        <svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg">
          <!-- 3つの円（輪郭のみ・重なりは中央バッジで強調） -->
          <circle cx="260" cy="140" r="105" fill="none" stroke="#999999" stroke-width="2"/>
          <circle cx="195" cy="250" r="105" fill="none" stroke="#AAAAAA" stroke-width="2"/>
          <circle cx="325" cy="250" r="105" fill="none" stroke="#666666" stroke-width="2"/>

          <!-- 円ラベル: 顧客（上） -->
          <text x="260" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">顧客</text>
          <text x="260" y="90" text-anchor="middle" font-size="10" fill="#999999">Customer</text>
          <text x="260" y="24" text-anchor="middle" font-size="11" fill="#666666">省人化ニーズの高まり</text>

          <!-- 円ラベル: 競合（左下） -->
          <text x="130" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">競合</text>
          <text x="130" y="303" text-anchor="middle" font-size="10" fill="#999999">Competitor</text>
          <text x="105" y="392" text-anchor="middle" font-size="11" fill="#666666">大手は大企業向けに集中</text>

          <!-- 円ラベル: 自社（右下） -->
          <text x="392" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">自社</text>
          <text x="392" y="303" text-anchor="middle" font-size="10" fill="#999999">Company</text>
          <text x="412" y="392" text-anchor="middle" font-size="11" fill="#666666">現場密着のサポート体制</text>

          <!-- 中央の交差部: 勝ち筋バッジ -->
          <circle cx="260" cy="215" r="52" fill="#555555" stroke="#333333" stroke-width="1"/>
          <text x="260" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">勝ち筋</text>
          <text x="260" y="228" text-anchor="middle" font-size="9" fill="#EEEEEE">中小製造業特化の</text>
          <text x="260" y="240" text-anchor="middle" font-size="9" fill="#EEEEEE">伴走支援</text>
        </svg>
      </div>

      <!-- 右側: 凡例エリア -->
      <div class="legend-area">
        <div class="legend-title">各領域の読み方</div>
        <div class="legend-card">
          <div class="legend-card-label">顧客が求めること</div>
          <div class="legend-card-desc">少人数でも回る在庫・生産管理</div>
        </div>
        <div class="legend-card">
          <div class="legend-card-label">競合ができていないこと</div>
          <div class="legend-card-desc">導入後の定着支援が手薄</div>
        </div>
        <div class="legend-card">
          <div class="legend-card-label">自社ができること</div>
          <div class="legend-card-desc">元現場出身者による導入伴走</div>
        </div>
        <div class="key-message-card">
          <div class="key-message-label">中央の重なり＝勝ち筋</div>
          <div class="key-message-desc">3つが重なる領域だけが持続的な差別化になる</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
