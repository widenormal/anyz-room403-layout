name: op-secrets (reusable)

# 1Password Service Account を真実源に、CI でシークレットを「メモリ注入のみ」で使う再利用ワークフロー。
#
# 設計（Codex レビュー Go 条件準拠）:
#   - secret 本体をディスクへ書かない。op run で子プロセス env に注入するだけ。
#   - 参照は secrets.map → gen-env-ref.sh で item ID 解決（R7: 括弧 title 回避）。
#   - GitHub の自動マスク + ::add-mask:: の二重化。secret を stdout に出さない。
#
# 前提:
#   - 呼び出し側リポの Actions secret に OP_SERVICE_ACCOUNT_TOKEN を登録（=案2）。
#   - ci/secrets/secrets.map / scripts/gen-env-ref.sh / scripts/op-run.sh が配置済み。
#
# 使い方（呼び出し側）:
#   jobs:
#     task:
#       uses: ./.github/workflows/op-secrets.yml
#       with:
#         run: |
#           python app.py        # この中で env から各キーを参照（値はログに出さない）
#       secrets:
#         OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

on:
  workflow_call:
    inputs:
      run:
        description: op run の子プロセスとして実行するコマンド
        required: true
        type: string
      strict:
        description: field 未投入を fail にする（既定 false=warn+skip）
        required: false
        default: false
        type: boolean
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

jobs:
  op-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Resolve refs and run command (memory injection only)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          STRICT_FLAG: ${{ inputs.strict && '--strict' || '' }}
          USER_CMD: ${{ inputs.run }}
        shell: bash
        run: |
          set -uo pipefail
          # SA トークンを明示マスク（GitHub の secret マスクと二重化）
          echo "::add-mask::${OP_SERVICE_ACCOUNT_TOKEN}"

          # 参照テンプレ（ID参照のみ・非secret）を生成し、解決された各 secret 値も add-mask する。
          # 値は op read で一時取得して add-mask 登録するだけ。stdout には出さない。
          REF="$(bash scripts/gen-env-ref.sh ${STRICT_FLAG})"
          while IFS='=' read -r k ref; do
            case "$k" in ''|\#*) continue ;; esac
            val="$(op read "$ref" 2>/dev/null || true)"
            [ -n "$val" ] && echo "::add-mask::${val}"
          done <<< "$REF"

          # メモリ注入で実行（secret はディスクに残さない）
          bash scripts/op-run.sh ${STRICT_FLAG} -- bash -c "${USER_CMD}"
